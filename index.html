<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Jobforge</title>
    <meta name="description" content="Phone-first 3D action RPG where stats unlock your skills." />
    <meta name="theme-color" content="#10162b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jobforge" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>
      <canvas id="overlay"></canvas>
      <div id="touch-layer">
        <div class="stick-base"><div class="stick-knob"></div></div>
      </div>
      <div id="skills"></div>
      <div id="hud-root"></div>
      <div id="pause" hidden></div>
      <div id="rotate"></div>
      <div id="boot">
        <div class="boot-card">
          <div class="logo">Jobforge</div>
          <div id="boot-msg"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
